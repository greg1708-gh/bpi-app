name: Build app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk "BPI-Inspections-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BPI-Inspections-1.0.${{ github.run_number }}
          path: BPI-Inspections-1.0.${{ github.run_number }}.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BPI Inspections 1.0.${{ github.run_number }}
          body: |
            Install on your phone: open this page on the S26 Ultra, tap the .apk below, then tap Install.
            This version installs over the previous one and keeps your jobs, clients and photos.
            Changes: ${{ github.event.head_commit.message }}
          files: BPI-Inspections-1.0.${{ github.run_number }}.apk
          make_latest: true
